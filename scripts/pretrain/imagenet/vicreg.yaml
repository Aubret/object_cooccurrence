defaults:
  - _self_
  - augmentations: asymmetric.yaml
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "vicreg"
method: "vicreg"
backbone:
  name: "resnet50"
method_kwargs:
  proj_hidden_dim: 8192
  proj_output_dim: 8192
  sim_loss_weight: 25.0
  var_loss_weight: 25.0
  cov_loss_weight: 1.0
  layers: 3
data:
  dataset: imagenet
  train_path: "/scratch/autolearn/aubret/imgnet/data/"
  val_path: "/scratch/autolearn/aubret/imgnet/data/"
  format: "h5"
  num_workers: 4
optimizer:
  name: "lars"
  batch_size: 128
  lr: 1.6
  classifier_lr: 0.3
  weight_decay: 1e-6
  kwargs:
    clip_lr: False
    eta: 0.001
    exclude_bias_n_norm: True
scheduler:
  name: "warmup_cosine"
checkpoint:
  enabled: True
  dir: "/scratch/autolearn/aubret/solo_trained/"
  frequency: 1
auto_resume:
  enabled: True

knn_clb:
  enabled: False
  verbose: True
  dataset: imagenet
  k:
    - 10
    - 20
    - 50
    - 100
  perform_on_validation: True
  train_path: "/scratch/autolearn/aubret/imgnet/data/"
  val_path: "/scratch/autolearn/aubret/imgnet/data/"
  format: h5
  freq_epochs: 20

# overwrite PL stuff
max_epochs: 100
devices: [0, 1, 2, 3, 4, 5, 6 ,7]
sync_batchnorm: True
accelerator: "gpu"
strategy: "ddp"
precision: 16-mixed
accumulate_grad_batches: 1