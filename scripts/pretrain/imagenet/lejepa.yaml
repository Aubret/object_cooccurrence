defaults:
  - _self_
  - augmentations: multicrop_jepa.yaml
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "lejepa"
method: "lejepa"
backbone:
  name: "resnet50"
method_kwargs:
  n_slices: 1024
  t_max: 3
  n_points: 17
  lamb: 0.02
data:
  dataset: imagenet
  train_path: "/scratch/autolearn/aubret/imgnet/data/"
  val_path: "/scratch/autolearn/aubret/imgnet/data/"
  format: "h5"
  num_workers: 4
optimizer:
  name: "adamw"
  batch_size: 64
  lr: 0.001
  classifier_lr: 3e-3
  weight_decay: 5e-4
scheduler:
  name: "warmup_cosine"
checkpoint:
  enabled: True
  dir: "/scratch/autolearn/aubret/solo_trained/"
  frequency: 1
auto_resume:
  enabled: True

knn_clb:
  enabled: False
  verbose: True
  dataset: imagenet
  k:
    - 10
    - 20
    - 50
    - 100
  perform_on_validation: True
  train_path: "/scratch/autolearn/aubret/imgnet/data/"
  val_path: "/scratch/autolearn/aubret/imgnet/data/"
  format: h5
  freq_epochs: 20

# overwrite PL stuff
max_epochs: 100
devices: [0, 1, 2, 3, 4, 5, 6 ,7]
sync_batchnorm: True
accelerator: "gpu"
strategy: "ddp"
precision: 32
accumulate_grad_batches: 1